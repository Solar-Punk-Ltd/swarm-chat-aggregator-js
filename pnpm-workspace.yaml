# One package, and pnpm's settings for it.

# Every dependency is added at its exact version.
saveExact: true

# No version younger than one week (in minutes) is installed, transitive ones included, and an install fails rather
# than fall back to an older version when nothing in a range is old enough.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# Our own packages, published by us, are exempt from the wait.
minimumReleaseAgeExclude:
  - '@solarpunkltd/swarm-chat-js'

# The dependencies whose install scripts run, true, or are skipped, false. bufferutil and utf-8-validate are optional
# ws accelerators, left off so the image needs no compiler.
allowBuilds:
  bufferutil: false
  utf-8-validate: false
